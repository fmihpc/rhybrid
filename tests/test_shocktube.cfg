# 1D shocktube configuration

# Use this config file with macro in user.cpp: #define USE_SHOCKTUBE_TEST_CONFIGURATION

# ..then user.cpp L1906-1916 set initial B as:
#   faceBx = 1.5e-9 T
#   faceBy(x >= 0.5e5) = 1e-9 T
#   faceBy(x < 0.5e5) = -1e-9 T
#   faceBz = 0.0

# this config file sets initial properties of protons:

# T = 7.243e4 K
# n(x >= 0.5e5) = 1e6 m^{-3} (protons_left)
# n(x < 0.5e5) = 3e6 m^{-3} (protons_right)
#
# => pressures (n*kB*T) are:
#
# p(x >= 0.5e5) = 1e6*kB*7.243e4 = 1e-12 Pa
# p(x <  0.5e5) = 3e6*kB*7.243e4 = 3e-12 Pa


gridbuilder = LogicallyCartesian

[Restart]
filename = 

[Simulation]
time_initial = 0.0
maximum_timesteps = 1000
dt = 0.0001
data_save_interval = 50
data_save_interval_unit = timestep
data_save_initial_state = yes
maximum_load_imbalance = 1.2
repartition_check_interval = 100
random_number_generator.seed = 6461674
restart_write_interval = 0
restart_major_store_interval = 0
restart_minor_store_amount = 0
#restart = yes
mesh_always_written = yes

[LoadBalance]
methods = RCB
#methods = RANDOM
tolerances = 1.05
processes_per_partition = 2

[LogicallyCartesian]
geometry = cartesian
x_periodic = no
y_periodic = no
z_periodic = yes
x_min = 0
y_min = -30
z_min = -10
x_max = 1e5
y_max = 30
z_max = +10
dx_uniform = yes
dy_uniform = yes
dz_uniform = yes
x_size = 5000
y_size = 3
z_size = 1
x_label = x-axis
y_label = y-axis
z_label = z-axis
x_units = m
y_units = m
z_units = m
force_cubic_cells = no

[DataOperatorExcludes]
exclude_list =

[Hybrid]
log_interval = 5
log_precision = 10
includeInnerCellsInFieldLog = 0
main_log_diagnostics_interval = 500
output_parameters = cellB n v
data_save_all_timesteps_t_start = -1
data_save_all_timesteps_t_end = -1
save_reduced_state_interval = 0
save_reduced_state_Nstride = 10
save_reduced_state_include_particles = 0
save_particles = 0
save_particles_Nstride = 10
R_object = 1e3
R_fieldObstacle = -100
fieldObstacleUe = (0,0,0)
R_particleObstacle = -100
use_gravity = 0
M_object = 0
use_hall_term = 0
include_B0_faraday = 0
particle.population.uniform = protons_left
particle.population.uniform = protons_right

[ElectronPressure]
use_electron_pressure = 0
temperature = 0
closure_gamma = 0
R_zero = -100

[Resistivity]
profile_name = resistivityConstant
value_unit = grid
value = 0.002
R = 1
outer_boundary_cells = 0 0 0 0 0 0
outer_boundary_coeffs = 1 1 1 1 1 1

[Constraints]
max_ion_velocity = 100e3
max_electron_velocity = 100e3
min_ion_charge_density_relative = 0.0125
max_electric_field = -100
max_whistler_velocity = 0
max_magnetic_field_stop_run = 1000e-9
initial_flow_throughs = -1
electric_field_linear_smoothing_number = 0
electric_field_smoothing_gauss_sigma = 0

[IMF]
Bx = 0.0
By = 0.0
Bz = 0.0
BoundaryCellB = 0 0 0 0 0 0
BoundaryFaceB = 0 0 0 0 0 0

[IntrinsicB]
profile_name = constantBx
laminarR = 0.0
coeffDipole = 0.0
coeffQuadrupole = 0.0
dipoleSurfaceB = 0.0
dipoleSurfaceR = 0.0
minimumR = 1

[protons_left]
mass_unit = MASS_PROTON
charge_unit = CHARGE_ELEMENTARY
mass = 1.0
charge = +1.0
obstacle = -100.0
accumulate = 1
accelerate = 1
output_str = H+
injector.name = UniformInjector
injector.parameters = inj_protons_left
accumulator.name = HybridAccumulator
accumulator.parameters =
boundary_condition.name = HybridBoundaryCond
boundary_condition.parameters =
propagator.name = BorisBuneman
propagator.parameters =

[inj_protons_left]
velocity = (0,0,0)
density = 1e6
temperature = 7.243e4
macroparticles_per_cell = 1000
xmin = 0
xmax = 50e3

[protons_right]
mass_unit = MASS_PROTON
charge_unit = CHARGE_ELEMENTARY
mass = 1.0
charge = +1.0
obstacle = -100.0
accumulate = 1
accelerate = 1
output_str = H+
injector.name = UniformInjector
injector.parameters = inj_protons_right
accumulator.name = HybridAccumulator
accumulator.parameters =
boundary_condition.name = HybridBoundaryCond
boundary_condition.parameters =
propagator.name = BorisBuneman
propagator.parameters =

[inj_protons_right]
velocity = (0,0,0)
density = 3e6
temperature = 7.243e4
macroparticles_per_cell = 1000
xmin = 50e3
xmax = 100e3

